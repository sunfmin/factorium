\* One daemon, the CLI's promote, two workers who each run `done` twice
\* (a red one lands again); one death, one lost answer. The worker's end
\* and its issue's close as one step (LineEnd.cfg checks them as the two
\* the code takes). The properties over time are LineLive.cfg's.
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1"}
    MaxDones = 2
    MaxDeaths = 1
    MaxLost = 1
    EndSplit = FALSE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK ProvingOnlyGated BaseBehindProving ClosedIsLanded OneAtATime CutFromBase
CHECK_DEADLOCK FALSE
