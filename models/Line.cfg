\* One daemon, the CLI's promote, two workers who each run `done` twice
\* (a red one lands again); one death, one lost answer. The worker's end
\* and its issue's close as the two steps the code takes, so a run's trace
\* is one of its behaviours (LineEnd.cfg checks the issue closed after a
\* death between them). The properties over time are LineLive.cfg's.
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1"}
    MaxDones = 2
    MaxDeaths = 1
    MaxLost = 1
    EndSplit = TRUE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK ProvingOnlyGated BaseBehindProving ClosedIsLanded OneAtATime CutFromBase
CHECK_DEADLOCK FALSE
