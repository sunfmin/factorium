\* What the pid file's lock rules out (crates/factorium/src/lock.rs): two
\* daemons at once land at once, and (a gate red on one, green on the
\* other) push a branch whose worker one told red: PushedNotRed fails here
\* too, with no variant. The code runs one daemon (Line.cfg).
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1", "d2"}
    MaxDones = 1
    MaxDeaths = 0
    MaxLost = 0
    EndSplit = FALSE
    Bug = "none"
SPECIFICATION Spec
INVARIANT OneAtATime
CHECK_DEADLOCK FALSE
