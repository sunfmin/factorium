\* A finding: the CLI commands that abandon a worktree (start-over, close,
\* discard) read the issue, then act, as processes of their own; a tick's
\* start may run between (Races). The code breaks NoStartOverUnderWorker
\* so (and WorkNeverLost after it), so it is not in the gate:
\* `models/worktrees.sh finding` shows its counterexample.
CONSTANTS
    A = 3
    W = 2
    Races = TRUE
    Dies = {"taken", "landed", "close", "commit", "keep", "remove"}
    Bug = "none"
    Depth = 100
SPECIFICATION Spec
VIEW View
CONSTRAINT Shallow
INVARIANT TypeOK WorkNeverLost OneOwner DoctorFinds
PROPERTY HeldWhenUnknown NoStartOverUnderWorker
CHECK_DEADLOCK FALSE
