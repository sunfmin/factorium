\* The constants of a scenario's run, for its trace (heavy-run): times in
\* units of the scenario's poll, 500 ms (the mapping divides by it), so
\* heavy_settle's 30s is 60 and hold_bound's 1800s is 3600; entries up to
\* 6; CLI waiters under one binary's rules, no line moves. Each step may
\* take any time up to the horizon: a trace's records carry their own.
\* Its own check goes one step deep: the properties are heavy-starts',
\* heavy-ends' and heavy-rules'.
CONSTANTS
    Ids = {1, 2, 3, 4, 5, 6}
    MaxRules = 1
    Settle = 60
    Hold = 3600
    Horizon = 400
    MaxStep = 400
    ReadLag = 0
    BoundLag = 0
    Kinds = {"wait"}
    Unqueues = TRUE
    Bug = "none"
    Depth = 1
SPECIFICATION Spec
VIEW View
CONSTRAINT Shallow
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
