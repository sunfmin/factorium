\* An issue's worktrees, as the code keeps them: three attempts, two
\* tokens of work; a CLI command's steps do not interleave with the
\* daemon's (the race they can run is models/WorktreesRace.cfg), and any
\* process dies at any point.
CONSTANTS
    A = 3
    W = 2
    Races = FALSE
    Dies = {"taken", "opened", "landed", "close", "commit", "keep", "remove"}
    Bug = "none"
    Depth = 100
SPECIFICATION Spec
VIEW View
CONSTRAINT Shallow
INVARIANT TypeOK WorkNeverLost OneOwner DoctorFinds
PROPERTY HeldWhenUnknown NoStartOverUnderWorker
CHECK_DEADLOCK FALSE
