\* Resources (factorium#284, #286): three CLI waiters, one rules, no line
\* moves, no unqueue; a named resource "dev" of one slot beside "host"; a
\* worker whose hold may declare 2 against the default 1, and wait for a
\* window opening at 1; a starve bound of 1, within time 0..3.
CONSTANTS
    Ids = {1, 2, 3}
    MaxRules = 1
    Settle = 1
    SettleIdle = 1
    Hold = 9
    Horizon = 3
    BoundLag = 0
    Kinds = {"wait"}
    Keep = 0
    Unqueues = FALSE
    MaxStep = 0
    ReadLag = 0
    Named = {"dev"}
    Slots = 1
    Asks = {{"host"}, {"dev"}, {"host", "dev"}}
    Workers = {"w"}
    Holds = {2}
    Opens = {1}
    Starve = 1
    Default = 1
    Urgent = FALSE
    Bug = "none"
    Depth = 6
SPECIFICATION Spec
VIEW StartView
CONSTRAINT Shallow
INVARIANT TypeOK SlotsKept AtOnce Settled
PROPERTY InOrder InWindow InsideHold
CHECK_DEADLOCK FALSE
