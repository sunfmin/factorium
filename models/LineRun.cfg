\* The constants of a scenario's run, for its trace (line-run): its one
\* worker, one daemon; the worker's end and its issue's close as the code's
\* two steps. The properties are line's and line-live's.
CONSTANTS
    Workers = {1}
    Daemons = {"d1"}
    MaxDones = 2
    MaxDeaths = 2
    MaxLost = 2
    EndSplit = TRUE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
