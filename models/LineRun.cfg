\* The constants of a scenario's run, for its trace (line-run): two
\* workers, each running `done` once, one daemon; one death or failed tick,
\* one lost answer; the worker's end and its issue's close as the code's two
\* steps; a merge may take regenerated records. The properties are line's
\* and line-live's.
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1"}
    MaxDones = 1
    MaxDeaths = 1
    MaxLost = 1
    EndSplit = TRUE
    Regenerates = TRUE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK
CHECK_DEADLOCK FALSE
