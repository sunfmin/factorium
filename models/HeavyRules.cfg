\* Waiters of two binaries' rules: three CLI runs, no line moves, no
\* unqueue; a settle interval of 1 within 0..3.
CONSTANTS
    Ids = {1, 2}
    MaxRules = 2
    Settle = 1
    SettleIdle = 1
    Hold = 2
    Horizon = 3
    BoundLag = 0
    Kinds = {"wait"}
    Keep = 1
    Unqueues = FALSE
    MaxStep = 0
    ReadLag = 1
    Named = {}
    Slots = 1
    Asks = {{"host"}}
    Workers = {}
    Holds = {}
    Opens = {}
    Starve = 9999
    Default = 1
    Urgent = FALSE
    Bug = "none"
    Depth = 10
SPECIFICATION Spec
VIEW StepView
CONSTRAINT Shallow
INVARIANT TypeOK StaleHoldsNone KeptPlace AtOnce
PROPERTY StaleRefused
CHECK_DEADLOCK FALSE
