\* Waiters of two binaries' rules: three CLI runs, no line moves, no
\* unqueue; a settle interval of 1 within 0..3.
CONSTANTS
    Ids = {1, 2}
    MaxRules = 2
    Settle = 1
    Hold = 2
    Horizon = 3
    BoundLag = 0
    Kinds = {"wait"}
    Keep = 1
    Unqueues = FALSE
    MaxStep = 0
    ReadLag = 1
    Bug = "none"
    Depth = 10
SPECIFICATION Spec
VIEW View
CONSTRAINT Shallow
INVARIANT TypeOK
PROPERTY StaleRefused StaleHoldsNone AtOnce KeptPlace
CHECK_DEADLOCK FALSE
