\* A merge that takes records its gate regenerates from the copy below:
\* amended into its merge as its gate ends green, the layers stacked on the
\* unamended merge stack again on what was pushed. As LineLive.cfg, each
\* worker running `done` once, as each merge doubles what the line can be.
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1"}
    MaxDones = 1
    MaxDeaths = 1
    MaxLost = 1
    EndSplit = FALSE
    Regenerates = TRUE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK ProvingOnlyGated BaseBehindProving ClosedIsLanded RedAfterGreenBelow LandsOnce OneAtATime CutFromBase
CHECK_DEADLOCK FALSE
