\* A finding: UnqueuedAnswers, under heavy-ends' constants. The code
\* breaks it (an unqueued waiting entry's waiter queues it again), so it is
\* not in the gate: `models/heavy.sh finding` shows its counterexample.
CONSTANTS
    Ids = {1, 2}
    MaxRules = 1
    Settle = 1
    Hold = 1
    Horizon = 4
    BoundLag = 1
    Kinds = {"wait", "beside"}
    Unqueues = TRUE
    MaxStep = 0
    ReadLag = 1
    Bug = "none"
    Depth = 10
SPECIFICATION Spec
VIEW View
CONSTRAINT Shallow
INVARIANT TypeOK UnqueuedAnswers
CHECK_DEADLOCK FALSE
