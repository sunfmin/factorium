\* The code's two steps for a worker's end: it recorded landed
\* (GreenLanding), then its issue closed (CloseIssue); a daemon that dies
\* between them leaves the issue open, and the next tick closes it
\* (LandSweep, factorium#192).
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1"}
    MaxDones = 1
    MaxDeaths = 1
    MaxLost = 1
    EndSplit = TRUE
    Regenerates = FALSE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY LandedCloses
CHECK_DEADLOCK FALSE
