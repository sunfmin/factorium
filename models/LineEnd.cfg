    Workers = {1, 2}
    Daemons = {"d1"}
    MaxDones = 1
    MaxDeaths = 1
    MaxLost = 1
    EndSplit = TRUE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY LandedCloses
CHECK_DEADLOCK FALSE
