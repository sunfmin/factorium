\* The variant the pid file's lock rules out (crates/factorium/src/lock.rs):
\* two daemons at once, as a pid file checked, then written let two that
\* raced their start run. The pushes' leases keep proving and the base
\* whole even then; that two land at once is LineTwoFinding.cfg's.
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1", "d2"}
    MaxDones = 1
    MaxDeaths = 0
    MaxLost = 0
    EndSplit = FALSE
    Regenerates = FALSE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK ProvingOnlyGated BaseBehindProving ClosedOnProving CutFromBase
CHECK_DEADLOCK FALSE
