\* Two daemons that raced their start (the pid file is checked, then
\* written): the pushes' leases keep proving and the base whole. That two
\* land at once is a finding (LineTwoFinding.cfg).
CONSTANTS
    Workers = {1, 2}
    Daemons = {"d1", "d2"}
    MaxDones = 1
    MaxDeaths = 0
    MaxLost = 0
    EndSplit = FALSE
    Bug = "none"
SPECIFICATION Spec
INVARIANT TypeOK ProvingOnlyGated BaseBehindProving ClosedOnProving CutFromBase
CHECK_DEADLOCK FALSE
