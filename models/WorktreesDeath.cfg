\* A finding: the daemon dies between a start's new worktree and its
\* record. Its issue stays taken by an attempt that never started, and
\* its worktree is never a doctor finding: the code breaks DoctorFinds, so
\* it is not in the gate: `models/worktrees.sh finding` shows it.
CONSTANTS
    A = 3
    W = 2
    Races = FALSE
    Dies = {"taken", "opened", "landed", "close", "commit", "keep", "remove"}
    Bug = "none"
    Depth = 100
SPECIFICATION Spec
VIEW View
CONSTRAINT Shallow
INVARIANT TypeOK WorkNeverLost OneOwner DoctorFinds
PROPERTY HeldWhenUnknown NoStartOverUnderWorker
CHECK_DEADLOCK FALSE
