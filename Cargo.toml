[workspace]
resolver = "3"
members = ["crates/domain", "crates/harness", "crates/host", "crates/factorium"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/sunfmin/factorium"

[workspace.dependencies]
factorium-domain = { path = "crates/domain" }
factorium-harness = { path = "crates/harness" }
factorium-host = { path = "crates/host" }
factum = { git = "https://github.com/sunfmin/factum", rev = "c20994b1d1b30463aa08edc1ed601457589f9150" }
factum-core = { git = "https://github.com/sunfmin/factum", rev = "c20994b1d1b30463aa08edc1ed601457589f9150" }
factum-sqlite = { git = "https://github.com/sunfmin/factum", rev = "c20994b1d1b30463aa08edc1ed601457589f9150" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"

# Dependencies built optimized in the dev profile: the scenarios spend their
# own CPU in sqlite, serde_json and tokio, not in factorium's code
# (factorium#98).
[profile.dev.package."*"]
opt-level = 2
