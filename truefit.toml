# factorium's ties to the programs it drives (truefit ADR 0001). The
# scenarios stand in for Orca, Homebrew, stablehand, slimfit, rolesmith and launchd in
# process (crates/factorium/tests/scenarios/fixture/fakes.rs); `standin`
# (crates/factorium/examples/standin.rs) runs those very fakes, or the real
# programs, through one driver, and prints what factorium reads of each
# answer. `./gate.sh` runs `truefit contract`; a real run is
# `truefit contract --real <name>`.
#
# A real run touches nothing of the host's own: each case runs in a scratch
# repo, worktree, terminal or launchd label of its own. What no case can run
# that way is left out, and said where:
#
# - Orca: the Orca cases share one scratch repo per host, kept from run to
#   run (`factorium-truefit` under factorium's state directory, standin's
#   `{scratch}`): registered once, by the first real run, and hidden. Each
#   case resets it at its start and its end (`{"scratch": branch}`: the
#   case's worktree and its terminals removed, its branch deleted), and
#   names what Orca keeps (worktree, branch, terminal title) by the case,
#   never by the run. Two real runs of one case at once on one host would
#   reset each other's. A case that needs a fresh project of its own
#   removes it at its end (`orca project setup-delete --setup <repo id>
#   --force --json`), never leaves it hidden.
# - Homebrew: `update`, and `install` / `upgrade` of a formula that exists,
#   change the host's Homebrew; only answers about one no tap has, and
#   reads of factorium's own install, run.
# - stablehand: its real run keeps books of its own in the case's
#   directory, never the host's; a portable login's token is its token
#   command's, the host's own, so no case runs one.
# - launchd: only a scratch agent, `/usr/bin/true`, never run at load.

[contract]
# The command that runs the scenarios' fakes: each fake is a program of
# FakeHost::run there, and each has a [[standin]] below.
standins = ["crates/factorium/tests/contract/standin"]
fresh_days = 30

[[standin]]
name = "orca"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "Orca's app running, `orca` on PATH"
ready = ["orca", "status", "--json"]
version = ["orca", "--version"]
normalise = [
  # Orca's handles and ids, and where it keeps a worktree.
  { pattern = '"(handle|id)":"[^"]*"', replace = '"$1":"<id>"' },
  { pattern = 'term[-_][0-9a-f-]+', replace = "<terminal>" },
  { pattern = '"ok":"[^"]*/truefit-[a-z-]+"', replace = '"ok":"<worktree>"' },
  # Orca's id of a refused prompt, for a retry factorium never makes.
  { pattern = ' Terminal prompt request ID: [^"]*', replace = "" },
  # Where the nested worktree Orca refuses for is.
  { pattern = 'registered worktree: [^"]*/truefit-[a-z-]+/', replace = "registered worktree: <worktree>/" },
  # Where a case's worktree is, in the git steps run in it.
  { pattern = '"/[^"]*/truefit-nested-worktree', replace = '"<worktree>' },
]
# What factorium handles after a step took effect (fakes::ORCA_FAULTS): a
# message given to a session's outbox that Orca will not type (it stays
# not typed, and whoever said it hears so); a worktree Orca will not remove
# after an abandon forced its branch (the close is refused, the worktree
# and the branch stay). A terminal Orca will not open in a worktree it
# holds, or will not close, it cannot be made to refuse on a host: no
# fault stands for either.
faults = ["send-refused", "remove-refused"]

# What factorium makes of Orca's answers about what it does not hold.
[[standin.case]]
name = "unknown"
stdin = """
{"orca": "screen", "args": ["truefit-no-such-terminal"]}
{"orca": "close", "args": ["truefit-no-such-terminal"]}
{"orca": "ready", "args": ["truefit-no-such-terminal"]}
{"orca": "press", "args": ["truefit-no-such-terminal", "\\u001b"]}
{"orca": "remove", "args": ["{dir}/no-such-worktree"]}
{"run": ["orca", "repo", "show", "--repo", "path:{dir}", "--json"], "read": ["/ok", "/error/code"]}
{"run": ["orca", "terminal", "create", "--worktree", "path:{dir}", "--title", "t", "--command", "true", "--json"], "read": ["/ok", "/error/code"]}
"""

# A worker's life in Orca: its worktree made, its terminal opened, read,
# typed at, listed, closed, and the worktree removed.
[[standin.case]]
name = "worktree-and-terminal"
stdin = """
{"scratch": "truefit-worktree-and-terminal"}
{"orca": "worktree", "args": ["{scratch}", "truefit-worktree-and-terminal", "truefit-worktree-and-terminal", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "cat"], "keep": {"terminal": "/ok"}}
{"orca": "ready", "args": ["{terminal}"]}
{"orca": "screen", "args": ["{terminal}"]}
{"orca": "listed", "args": ["{terminal}"]}
{"orca": "send", "args": ["{terminal}", "typed"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "screen", "args": ["{terminal}"]}
{"orca": "listed", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-worktree-and-terminal"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A worktree made with a name and a comment, as the line's work dirs and
# workers' worktrees are: Orca lists it with both, then with the name it is
# shown as and the comment set after, and once it is removed, not at all.
[[standin.case]]
name = "commented-worktree"
stdin = """
{"scratch": "truefit-commented-worktree"}
{"orca": "worktree", "args": ["{scratch}", "truefit commented", "truefit-commented-worktree", "{sha}", "what runs here; factorium removes it when this ends (pid 1)."], "keep": {"worktree": "/ok"}}
{"orca": "listed_worktree", "args": ["{worktree}"]}
{"orca": "show_as", "args": ["{worktree}", "truefit shown"]}
{"orca": "comment", "args": ["{worktree}", "what ran here; kept."]}
{"orca": "listed_worktree", "args": ["{worktree}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"orca": "listed_worktree", "args": ["{worktree}"]}
{"scratch": "truefit-commented-worktree"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A terminal Orca will not type at: the real one closed first.
[[standin.case]]
name = "send-refused"
fault = "send-refused"
stdin = """
{"scratch": "truefit-send-refused"}
{"orca": "worktree", "args": ["{scratch}", "truefit-send-refused", "truefit-send-refused", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "cat"], "keep": {"terminal": "/ok"}}
{"orca": "ready", "args": ["{terminal}"]}
{"orca": "close", "args": ["{terminal}"], "only": "real"}
{"orca": "send", "args": ["{terminal}", "typed"]}
{"orca": "deliver", "args": ["{terminal}", "typed"]}
{"orca": "press", "args": ["{terminal}", "\\u001b"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-send-refused"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A worktree that holds another git worktree (slimfit's comparison one):
# Orca refuses to remove it, naming the nested one, until that goes.
[[standin.case]]
name = "nested-worktree"
stdin = """
{"scratch": "truefit-nested-worktree"}
{"orca": "worktree", "args": ["{scratch}", "truefit-nested-worktree", "truefit-nested-worktree", "{sha}"], "keep": {"worktree": "/ok"}}
{"run": ["git", "-C", "{worktree}", "worktree", "add", "--quiet", "--detach", "{worktree}/.slimfit/out/before", "HEAD"], "read": "ok"}
{"orca": "remove", "args": ["{worktree}"]}
{"run": ["git", "-C", "{worktree}", "worktree", "remove", "--force", "{worktree}/.slimfit/out/before"], "read": "ok"}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-nested-worktree"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A worktree Orca will not remove: the real one a directory it does not hold.
[[standin.case]]
name = "remove-refused"
fault = "remove-refused"
stdin = """
{"run": ["mkdir", "{dir}/held"], "read": "ok"}
{"orca": "remove", "args": ["{dir}/held"]}
"""

# live_orca's checks: a tell to a Claude Code busy in a call that never
# returns only queues; one sent with its interrupt key is read now, as
# the session shows, though Orca sees no turn start. Its own
# stand-in, as its real run needs Claude Code logged in, and spends a turn.
[[standin]]
name = "orca-claude"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "Orca's app running, `orca` on PATH, and Claude Code logged in (`claude` on PATH)"
ready = ["sh", "-c", "orca status --json >/dev/null && claude --version"]
version = ["sh", "-c", "echo \"orca $(orca --version), claude $(claude --version)\""]
normalise = [
  { pattern = '"(handle|id)":"[^"]*"', replace = '"$1":"<id>"' },
  { pattern = 'term[-_][0-9a-f-]+', replace = "<terminal>" },
  { pattern = '"ok":"[^"]*/truefit-[a-z-]+"', replace = '"ok":"<worktree>"' },
]
# What factorium handles after a step took effect (fakes::ORCA_FAULTS): a
# tell sent now whose interrupt key went, so the agent's turn is stopped,
# and Orca then refuses the wait for its prompt or the text (the message
# is not typed, and whoever said it hears the turn was stopped). The rest
# of Orca's refusals are the orca stand-in's.
faults = ["refused-after-key"]

# Orca refuses once the key went: the real terminal a program the key
# ends, as no Claude Code can be made to end at its interrupt key.
[[standin.case]]
name = "refused-after-key"
fault = "refused-after-key"
stdin = """
{"scratch": "truefit-refused-after-key"}
{"orca": "worktree", "args": ["{scratch}", "truefit-refused-after-key", "truefit-refused-after-key", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "stty raw -echo; dd bs=1 count=1 >/dev/null 2>&1; exit"], "keep": {"terminal": "/ok"}}
{"run": ["sleep", "3"], "only": "real"}
{"orca": "deliver", "args": ["{terminal}", "Told now: reply NOW-SEEN and nothing else.", "\\u001b"]}
{"orca": "screen", "args": ["{terminal}"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-refused-after-key"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

[[standin.case]]
name = "busy-tell"
stdin = """
{"scratch": "truefit-busy-tell"}
{"orca": "worktree", "args": ["{scratch}", "truefit-busy-tell", "truefit-busy-tell", "{sha}"], "keep": {"worktree": "/ok"}}
{"run": ["mkfifo", "{worktree}/never"], "only": "real"}
{"orca": "open", "args": ["{worktree}", "truefit", "claude --dangerously-skip-permissions --model haiku"], "keep": {"terminal": "/ok"}}
# A scratch folder: the real one asks whether to trust it, and is answered as a person does.
{"run": ["sleep", "5"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--text", "\\u001b[B", "--json"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--enter", "--json"], "only": "real"}
{"orca": "ready", "args": ["{terminal}"]}
# Busy: in the real one, a call that never returns (Claude Code 2.1.330
# moves one to the background after 20s, so the tells go well before);
# in the fake, as a scenario sets it. Orca sees no turn that starts right
# after an interrupt (live_orca took the session's own file for it).
{"orca": "deliver", "args": ["{terminal}", "Call the Bash tool once, in the foreground (run_in_background false, no timeout change), with the command: cat never. Do not run it in the background."], "only": "real"}
{"run": ["sleep", "3"], "only": "real"}
{"world": {"busy": "{terminal}", "unobserved": true}}
{"orca": "deliver", "args": ["{terminal}", "Plain tell: reply QUEUED-SEEN."]}
{"orca": "deliver", "args": ["{terminal}", "Told now: reply NOW-SEEN and nothing else.", "\\u001b"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-busy-tell"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# factorium#179: idle, with a shell it moved to the background, Claude
# Code 2.1.330 is working as Orca 1.4.267 sees it, so a wait for tui-idle
# times out, before an Escape as after it. A tell sent with its interrupt
# key is still typed, and starts a turn.
[[standin.case]]
name = "idle-background-tell"
stdin = """
{"scratch": "truefit-idle-background-tell"}
{"orca": "worktree", "args": ["{scratch}", "truefit-idle-background-tell", "truefit-idle-background-tell", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "claude --dangerously-skip-permissions --model haiku"], "keep": {"terminal": "/ok"}}
{"run": ["sleep", "5"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--text", "\\u001b[B", "--json"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--enter", "--json"], "only": "real"}
{"orca": "ready", "args": ["{terminal}"]}
# The real one starts a shell in the background and ends its turn; the
# fake holds one as a scenario sets it.
{"orca": "deliver", "args": ["{terminal}", "Call the Bash tool once with run_in_background set to true and the command: sleep 900. Then reply STARTED and end your turn."], "only": "real"}
{"run": ["sleep", "15"], "only": "real"}
{"world": {"background": "{terminal}"}}
{"run": ["orca", "terminal", "wait", "--terminal", "{terminal}", "--for", "tui-idle", "--timeout-ms", "3000", "--json"], "read": ["/ok", "/error/code"]}
{"orca": "press", "args": ["{terminal}", "\\u001b"]}
{"orca": "deliver", "args": ["{terminal}", "Told now: reply NOW-SEEN and nothing else.", "\\u001b"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-idle-background-tell"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

[[standin]]
name = "brew"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "Homebrew, with factorium installed from it"
ready = ["brew", "list", "--versions", "factorium"]
version = ["brew", "--version"]
normalise = [
  { pattern = '"out":"[^"]*/opt/', replace = '"out":"<prefix>/opt/' },
  { pattern = 'factorium [0-9][^\\"]*', replace = "factorium <version>" },
]
# What factorium handles after a step took effect (fakes::BREW_FAULTS): an
# install or upgrade brew refuses once `brew update` took effect, and, in a
# cut, once its tag was pushed (the cut is recorded failed with brew's
# words, the tag stays, and a later install is read back; the daemon's own
# upgrade is a finding until one works). A failed `brew update`,
# `--prefix`, `--cellar` or `list` is read as nothing installed or
# linked, after no step of factorium's: no fault stands for those.
faults = ["upgrade-refused"]

[[standin.case]]
name = "no-such-formula"
env = { HOMEBREW_NO_AUTO_UPDATE = "1", HOMEBREW_NO_ENV_HINTS = "1" }
stdin = """
{"run": ["brew", "list", "--formula", "factorium-truefit-none"]}
{"run": ["brew", "list", "--versions", "factorium-truefit-none"], "read": "out"}
{"run": ["brew", "upgrade", "factorium-truefit-none"]}
{"run": ["brew", "install", "factorium-truefit-none"]}
"""

# factorium as Homebrew installed it: what `Brew::upgrade` and `Brew::bin` read.
[[standin.case]]
name = "installed"
env = { HOMEBREW_NO_AUTO_UPDATE = "1", HOMEBREW_NO_ENV_HINTS = "1" }
stdin = """
{"world": {"installed": {"factorium": "0.1.0"}}}
{"run": ["brew", "list", "--formula", "factorium"]}
{"run": ["brew", "list", "--versions", "factorium"], "read": "out"}
{"run": ["brew", "--prefix", "factorium"], "read": "out"}
"""

# An install and an upgrade brew refuses, though its tap has the formula:
# the real one of a formula no tap has, as brew refuses either.
[[standin.case]]
name = "upgrade-refused"
fault = "upgrade-refused"
env = { HOMEBREW_NO_AUTO_UPDATE = "1", HOMEBREW_NO_ENV_HINTS = "1" }
stdin = """
{"world": {"tap": {"factorium-truefit-none": "0.1.0"}}}
{"run": ["brew", "install", "factorium-truefit-none"]}
{"world": {"installed": {"factorium-truefit-none": "0.0.9"}}}
{"run": ["brew", "upgrade", "factorium-truefit-none"], "read": "out"}
"""

[[standin]]
name = "stablehand"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "stablehand on PATH"
version = ["stablehand", "--version"]
# What factorium handles after a step took effect (fakes::STABLEHAND_FAULTS):
# a limit stablehand will not book once a session on the account met it
# (the worker ends all the same, its issue free again, and the tick says
# stablehand's words as `unbooked`). Its other calls come before any step
# of factorium's (a pick, a credential, an account shown: the start is
# refused, nothing taken) or only read (`status`, `command show`); a
# `command set` refused leaves the kit's commands to move at the next
# daemon start: no fault stands for those.
faults = ["limit-refused"]

# What factorium reads of stablehand's answers about a bound login: which
# account a pick takes, and each it passes over with its reason; what a
# session on one is handed of its login (`credential`); a limit a screen showed, without a reset
# and with one; the books as `status` says them; and the refusals of an
# account it does not keep. The real one runs on books of the case's own
# (standin's `{dir}/.stablehand`); a bound login is logged in once its
# home holds its engine's login file, which the case writes. A portable
# login's token is its token command's, the host's own: no case runs one.
[[standin.case]]
name = "bound"
stdin = """
{"run": ["mkdir", "-p", "home/night", "home/later"], "read": "ok"}
{"run": ["stablehand", "account", "add", "night", "--engine", "codex", "--machine", "{machine}", "--home", "{dir}/home/night"], "read": ["/account/name", "/account/login", "/account/home"]}
{"run": ["stablehand", "account", "add", "later", "--engine", "codex", "--machine", "{machine}", "--home", "{dir}/home/later"], "read": ["/account/name"]}
{"run": ["stablehand", "account", "add", "away", "--engine", "codex", "--machine", "truefit-elsewhere", "--home", "/nowhere"], "read": ["/account/machine"]}
{"run": ["stablehand", "account", "show", "night"], "read": ["/account/engine", "/account/login", "/account/home", "/account/machine", "/account/off", "/logged_in"]}
{"run": ["stablehand", "pick", "--engine", "codex", "--machine", "{machine}"], "read": ["/account", "/none", "/until", "/why/*/account", "/why/*/reason", "/why/*/until"]}
{"run": ["stablehand", "credential", "night", "--json"], "read": ["/files", "/code"]}
{"run": ["touch", "home/night/auth.json", "home/later/auth.json"], "read": "ok"}
{"run": ["stablehand", "account", "show", "night"], "read": ["/logged_in"]}
{"run": ["stablehand", "pick", "--engine", "codex", "--machine", "{machine}"], "read": ["/account"]}
{"run": ["stablehand", "credential", "night", "--json"], "read": ["/login", "/files/*/as", "/files/*/path", "/env"]}
{"run": ["stablehand", "pick", "--engine", "codex", "--machine", "{machine}", "--running", "night=3,later=1"], "read": ["/account"]}
{"run": ["stablehand", "limit", "night"], "read": ["/limit/account", "/limit/resets_at", "/limit/window"]}
{"run": ["stablehand", "limit", "later", "--resets-at", "2030-01-01T00:00:00Z"], "read": ["/limit/account", "/limit/resets_at"]}
{"run": ["stablehand", "pick", "--engine", "codex", "--machine", "{machine}"], "read": ["/account", "/none", "/until", "/why/*/account", "/why/*/reason", "/why/*/until"]}
{"run": ["stablehand", "status"], "read": ["/accounts/*/name", "/accounts/*/engine", "/accounts/*/pace", "/accounts/*/limit/resets_at"]}
{"run": ["stablehand", "pick", "--engine", "kimi", "--machine", "{machine}"], "read": ["/account", "/none", "/until", "/why"]}
"""

# What a start reads of a pick that walks the order (factorium#291): none
# to walk without an order or an engine; the order set; the engine, model
# and account it answers whole; a walk narrowed to an engine with no
# account kept, skipped; and one narrowed to a model.
[[standin.case]]
name = "order"
stdin = """
{"run": ["mkdir", "-p", "home/a"], "read": "ok"}
{"run": ["stablehand", "account", "add", "a", "--engine", "codex", "--machine", "{machine}", "--home", "{dir}/home/a"], "read": ["/account/name"]}
{"run": ["touch", "home/a/auth.json"], "read": "ok"}
{"run": ["stablehand", "pick", "--machine", "{machine}"], "read": ["/code"]}
{"run": ["stablehand", "order", "set", "claude-code@opus", "codex"], "read": ["/order/*/engine", "/order/*/models"]}
{"run": ["stablehand", "pick", "--machine", "{machine}"], "read": ["/engine", "/model", "/account", "/none", "/why/*/engine", "/why/*/model", "/why/*/account", "/why/*/reason"]}
{"run": ["stablehand", "pick", "--machine", "{machine}", "--engine", "claude-code"], "read": ["/account", "/none", "/until", "/why/*/engine", "/why/*/model", "/why/*/reason", "/why/*/why"]}
{"run": ["stablehand", "pick", "--machine", "{machine}", "--engine", "codex", "--model", "o9"], "read": ["/engine", "/model", "/account"]}
"""

# What a start reads of the engines' commands (factorium#306): none on a
# fresh store; those set, as `command show` answers them; the refusals a
# move of the kit's commands meets (no `=`, an engine it does not know, a
# command naming a model), each writing nothing; and one dropped.
[[standin.case]]
name = "commands"
stdin = """
{"run": ["stablehand", "command", "show"], "read": ["/commands"]}
{"run": ["stablehand", "command", "set", "claude-code=claude --x", "grok=grok --always-approve"], "read": ["/commands/claude-code", "/commands/grok"]}
{"run": ["stablehand", "command", "set", "codex"], "read": ["/code"]}
{"run": ["stablehand", "command", "set", "vim=vim"], "read": ["/code"]}
{"run": ["stablehand", "command", "set", "codex=codex --model o3"], "read": ["/code"]}
{"run": ["stablehand", "command", "set", "grok="], "read": ["/commands"]}
{"run": ["stablehand", "command", "show"], "read": ["/commands"]}
"""

# What it refuses factorium: an account it does not keep, by every
# command factorium names one to, and a limit that lifted already.
[[standin.case]]
name = "no-account"
stdin = """
{"run": ["stablehand", "account", "add", "night", "--engine", "codex", "--machine", "{machine}", "--home", "{dir}/home"], "read": "ok"}
{"run": ["stablehand", "account", "show", "ghost"], "read": ["/code"]}
{"run": ["stablehand", "credential", "ghost", "--json"], "read": ["/code"]}
{"run": ["stablehand", "limit", "ghost"], "read": ["/code"]}
{"run": ["stablehand", "pick", "--engine", "codex", "--machine", "{machine}", "--running", "ghost=1"], "read": ["/code"]}
{"run": ["stablehand", "limit", "night", "--resets-at", "2001-01-01T00:00:00Z"], "read": ["/code"]}
"""

# A limit it will not book, of an account it keeps: the real one's books
# made read-only, as stablehand refuses a write it may not make.
[[standin.case]]
name = "limit-refused"
fault = "limit-refused"
stdin = """
{"run": ["stablehand", "account", "add", "night", "--engine", "codex", "--machine", "{machine}", "--home", "{dir}/home"], "read": "ok"}
{"run": ["chmod", "-R", "a-w", "{dir}/.stablehand"], "only": "real"}
{"run": ["stablehand", "limit", "night"], "read": ["/code", "/limit"]}
{"run": ["stablehand", "limit", "night", "--resets-at", "2030-01-01T00:00:00Z"], "read": ["/code", "/limit"]}
{"run": ["chmod", "-R", "u+w", "{dir}/.stablehand"], "only": "real"}
"""

[[standin]]
name = "slimfit"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "slimfit on PATH, and cargo-mutants (its mutants list)"
version = ["slimfit", "--version"]
# What factorium handles after a step took effect (fakes::SLIMFIT_FAULTS):
# a `--function` listing slimfit refuses once a picker was asked (the pick
# is not taken; with nothing to take it against, no harness's is, and
# nothing is kept). Its other calls come before any step of factorium's
# (the change's listing, `help picker`, `help reviewer`: the pick or review
# is refused, no second agent asked): no fault stands for those.
faults = ["function-refused"]

# `worker pick-mutants` and `review-growth`: the picker's and the
# reviewer's goals, and a change's candidates, of which factorium reads
# the names.
[[standin.case]]
name = "pick"
dir = "crates/factorium/tests/contract/slimfit-change"
stdin = """
{"world": {"slimfit": {"help picker": "The goal.", "help reviewer": "The reviewer's goal.", "check": "{\\"candidates\\": {\\"rust\\": [{\\"name\\": \\"src/lib.rs:4:27: replace a -> bool with true\\"}, {\\"name\\": \\"src/lib.rs:4:27: replace a -> bool with false\\"}, {\\"name\\": \\"src/lib.rs:4:29: replace == with != in a\\"}]}}"}}}
{"run": ["git", "init", "-q", "-b", "main"], "read": "ok"}
{"run": ["git", "add", "-A"], "read": "ok"}
{"run": ["git", "-c", "user.name=t", "-c", "user.email=t@t", "commit", "-q", "-m", "base"], "read": "ok"}
{"run": ["git", "checkout", "-q", "-b", "change"], "read": "ok"}
{"run": ["sh", "-c", "echo 'pub fn a(x: u8) -> bool { x == 1 }' >> src/lib.rs"], "read": "ok"}
{"run": ["git", "-c", "user.name=t", "-c", "user.email=t@t", "commit", "-q", "-am", "change"], "read": "ok"}
{"run": ["slimfit", "help", "picker"]}
{"run": ["slimfit", "help", "reviewer"]}
{"run": ["slimfit", "check", "--repo", "{dir}", "--mutants"], "read": ["/candidates/*/*/name"]}
"""

# A function's listing slimfit refuses, after the change's was listed: the
# real one of a change whose source its mutation tool then cannot parse.
[[standin.case]]
name = "function-refused"
fault = "function-refused"
dir = "crates/factorium/tests/contract/slimfit-change"
stdin = """
{"world": {"slimfit": {"check": "{\\"candidates\\": {\\"rust\\": [{\\"name\\": \\"src/lib.rs:4:27: replace a -> bool with true\\"}, {\\"name\\": \\"src/lib.rs:4:27: replace a -> bool with false\\"}, {\\"name\\": \\"src/lib.rs:4:29: replace == with != in a\\"}]}}"}}}
{"run": ["git", "init", "-q", "-b", "main"], "read": "ok"}
{"run": ["git", "add", "-A"], "read": "ok"}
{"run": ["git", "-c", "user.name=t", "-c", "user.email=t@t", "commit", "-q", "-m", "base"], "read": "ok"}
{"run": ["git", "checkout", "-q", "-b", "change"], "read": "ok"}
{"run": ["sh", "-c", "echo 'pub fn a(x: u8) -> bool { x == 1 }' >> src/lib.rs"], "read": "ok"}
{"run": ["git", "-c", "user.name=t", "-c", "user.email=t@t", "commit", "-q", "-am", "change"], "read": "ok"}
{"run": ["slimfit", "check", "--repo", "{dir}", "--mutants"], "read": ["/candidates/*/*/name"]}
{"run": ["sh", "-c", "echo 'pub fn b( {' >> src/lib.rs"], "only": "real"}
{"run": ["slimfit", "check", "--repo", "{dir}", "--mutants", "--function", "src/lib.rs: a"], "read": ["/candidates", "/next"]}
"""

[[standin]]
name = "rolesmith"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "rolesmith on PATH, with the source `felix` (sunfmin/lore) added"
version = ["rolesmith", "--version"]
# What factorium handles after a step took effect (fakes::ROLESMITH_FAULTS):
# a `tool install` refused, those programs before the failing one
# installed: it checks again and keeps why the install failed for doctor
# beside what is still lacking, its issues wait, and the same lack is not
# installed again.
faults = ["install-refused"]

# What factorium reads of `doctor --project` before a start: a directory
# without `rolesmith.toml` is refused, naming no thing lacking; one whose
# roles need nothing of the host passes. A role that lacks a program or an
# entry, and `tool install`, would need a library and a host made to lack
# them, and an install changes the host: no case runs those for real.
[[standin.case]]
name = "doctor"
dir = "crates/factorium/tests/contract/rolesmith-project"
stdin = """
{"run": ["rolesmith", "doctor", "--project", "{dir}/no-record", "--json"], "read": ["/error/kind", "/error/missing"]}
{"run": ["rolesmith", "doctor", "--project", "{dir}", "--json"], "read": ["/programs", "/entries", "/error/kind"]}
"""

# An install refused: the real one for a record naming a role its library
# lacks, as no program's script can be made to fail on a host.
[[standin.case]]
name = "install-refused"
fault = "install-refused"
dir = "crates/factorium/tests/contract/rolesmith-project"
stdin = """
{"run": ["rolesmith", "tool", "install", "--project", "{dir}/no-role", "--json"], "read": ["/error/kind", "/tools"]}
"""

[[standin]]
name = "ssh"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "ssh to localhost with no password asked (Remote Login on, a key it takes, its host key known)"
ready = ["ssh", "-o", "BatchMode=yes", "localhost", "true"]
version = ["sh", "-c", "ssh -V 2>&1"]

# `issue move` (`issue move --help`): each command runs in the target user's login
# shell, as `exec "$SHELL" -lc '<command>'`, a quote in it as `'\''`;
# factorium reads its stdout and whether it exited 0. A target not reached
# fails as a command there that fails does: neither changes anything here.
[[standin.case]]
name = "login-shell"
stdin = """
{"world": {"ssh": {"localhost": {"SHELL": "/bin/sh", "PATH": "/usr/bin:/bin", "HOME": "{dir}"}}}}
{"run": ["ssh", "-o", "BatchMode=yes", "localhost", "exec \\"$SHELL\\" -lc 'echo \\"it'\\\\''s there\\"'"], "read": "out"}
{"run": ["ssh", "-o", "BatchMode=yes", "localhost", "exec \\"$SHELL\\" -lc 'echo refused; exit 1'"], "read": "out"}
{"run": ["ssh", "-o", "BatchMode=yes", "no-such-host.invalid", "exec \\"$SHELL\\" -lc true"], "read": "ok"}
"""

[[standin]]
name = "launchctl"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "macOS's launchctl, in a GUI login session"
normalise = [
  { pattern = 'gui/[0-9]+', replace = "gui/<uid>" },
  { pattern = '[0-9]+-[0-9]{13}', replace = "<nonce>" },
]
version = ["sw_vers", "-productVersion"]

# `service install`, `stop` and `remove`, on a scratch agent's label.
[[standin.case]]
name = "agent"
dir = "crates/factorium/tests/contract/launchd-agent"
stdin = """
{"run": ["sed", "-i", "", "s/{label}/com.github.sunfmin.factorium.truefit-{nonce}/", "agent.plist"], "read": "ok"}
{"run": ["launchctl", "print", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "bootstrap", "gui/{uid}", "{dir}/agent.plist"]}
{"run": ["launchctl", "bootstrap", "gui/{uid}", "{dir}/agent.plist"]}
{"run": ["launchctl", "print", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "bootout", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "print", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "bootout", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
"""

# The heavy queue's design (docs/adr/0010-admission-and-the-heavy-queue.md), model-checked by TLC
# (truefit ADR 0001): models/HeavyQueue.tla, one model checked under five
# configs, each the smallest that still shows its properties fail on a
# broken variant (`models/heavy.sh broken`), and each bounded in depth.
# A scenario's run is checked as its trace (`models/heavy.sh trace`).
[[model]]
name = "heavy-starts"
spec = "models/HeavyQueue.tla"
config = "models/HeavyStarts.cfg"
limit = 120
commit = "d9d22cfeff3a36c5d2d7c38f78e897012379cc33"
covers = [
  { action = "Arrives", file = "crates/factorium/src/heavy.rs", function = "App::take_turn (EnqueueHeavy)" },
  { action = "Arrives", file = "crates/domain/src/heavy.rs", function = "EnqueueHeavy" },
  { action = "Ask", file = "crates/factorium/src/heavy.rs", function = "App::heavy, App::take_turn (StartHeavy), App::as_installed" },
  { action = "Ask", file = "crates/domain/src/heavy.rs", function = "StartHeavy, older, Queue::may_start, Queue::queue_of, Queue::passed_over" },
  { action = "Ask", file = "crates/domain/src/neutral/queue.rs", function = "may_start, next, line, oldest, overdue" },
  { action = "AtOnce", file = "crates/domain/src/neutral/queue.rs", function = "may_start" },
  { action = "InOrder", file = "crates/domain/src/neutral/queue.rs", function = "line, next" },
  { action = "LineAhead", file = "crates/domain/src/neutral/queue.rs", function = "line, next" },
  { action = "Settled", file = "crates/domain/src/neutral/queue.rs", function = "may_start" },
]

# heavy-ends' shape, three entries (.truefit/traces/heavy-starts/): each
# ask's reading and the last start before it are the step's own (`last`),
# never the queue's records.
[model.trace]
q = '[i \in Ids |-> r.state.q[i]]'
last_start = 'r.state.last_start'
rules = 'r.state.rules'
now = 'r.now'
waiter = '[i \in Ids |-> r.state.waiter[i]]'
last = 'r.last'

# The owner's urgent mark (docs/adr/0015-an-urgent-issue-halts-the-host.md)
# and a landing's gate (docs/adr/0010-admission-and-the-heavy-queue.md): the
# same model with entries marked urgent as they ask and again while they
# wait, the queue halted by urgent issues (cutting short only with no room
# for the urgent, ADR 0015 since 2026-11-27), and a line move that is a
# landing's gate; heavy-starts' waiters, in less time.
[[model]]
name = "heavy-urgent"
spec = "models/HeavyQueue.tla"
config = "models/HeavyUrgent.cfg"
limit = 180
commit = "2c6a502c02ed998e2fc6f615e275eb64a1a03cf2"
covers = [
  { action = "Arrives", file = "crates/factorium/src/heavy.rs", function = "App::take_turn (EnqueueHeavy urgent)" },
  { action = "Arrives", file = "crates/domain/src/heavy.rs", function = "EnqueueHeavy" },
  { action = "Marks", file = "crates/factorium/src/heavy.rs", function = "App::take_turn (EnqueueHeavy urgent)" },
  { action = "Marks", file = "crates/factorium/src/issues.rs", function = "App::urgent_worker" },
  { action = "Marks", file = "crates/domain/src/heavy.rs", function = "EnqueueHeavy (HeavyMarked), Heavy::evolve (HeavyMarked)" },
  { action = "NoteHalt", file = "crates/factorium/src/issues.rs", function = "App::note_halt" },
  { action = "NoteHalt", file = "crates/domain/src/heavy.rs", function = "NoteHalt, Heavy::evolve (HeavyHalted)" },
  { action = "Ask", file = "crates/domain/src/heavy.rs", function = "Queue::may_start, Queue::passed_over, Queue::halted, Queue::urgent" },
  { action = "Ask", file = "crates/domain/src/neutral/queue.rs", function = "line, next" },
  { action = "UrgentAhead", file = "crates/domain/src/neutral/queue.rs", function = "line, gives" },
  { action = "LandingAhead", file = "crates/domain/src/neutral/queue.rs", function = "line, gives" },
  { action = "LandingAhead", file = "crates/domain/src/heavy.rs", function = "Queued::lands" },
  { action = "HaltHolds", file = "crates/domain/src/heavy.rs", function = "Queue::passed_over, Queue::halted, Queue::urgent" },
]

# heavy-starts' shape (.truefit/traces/heavy-urgent/), with each entry's
# urgent mark and landing's gate, and whether urgent issues halt the queue;
# what else an entry asks for is NoAsk's, as this config's constants fix it.
[model.trace]
q = '[i \in Ids |-> r.state.q[i]]'
last_start = 'r.state.last_start'
rules = 'r.state.rules'
now = 'r.now'
waiter = '[i \in Ids |-> r.state.waiter[i]]'
ask = '[i \in Ids |-> [NoAsk EXCEPT !.urgent = r.state.ask[i].urgent, !.lands = r.state.ask[i].lands]]'
halt = 'r.state.halt'
last = 'r.last'

