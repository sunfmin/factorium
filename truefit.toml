# factorium's ties to the programs it drives (truefit ADR 0001). The
# scenarios stand in for Orca, Homebrew, mytokens, slimfit and launchd in
# process (crates/factorium/tests/scenarios/fixture/fakes.rs); `standin`
# (crates/factorium/examples/standin.rs) runs those very fakes, or the real
# programs, through one driver, and prints what factorium reads of each
# answer. `./gate.sh` runs `truefit contract`; a real run is
# `truefit contract --real <name>`.
#
# A real run touches nothing of the host's own: each case runs in a scratch
# repo, worktree, terminal or launchd label of its own. What no case can run
# that way is left out, and said where:
#
# - Orca: the Orca cases share one scratch repo per host, kept from run to
#   run (`factorium-truefit` under factorium's state directory, standin's
#   `{scratch}`): registered once, by the first real run, and hidden. Each
#   case resets it at its start and its end (`{"scratch": branch}`: the
#   case's worktree and its terminals removed, its branch deleted), and
#   names what Orca keeps (worktree, branch, terminal title) by the case,
#   never by the run. Two real runs of one case at once on one host would
#   reset each other's. A case that needs a fresh project of its own
#   removes it at its end (`orca project setup-delete --setup <repo id>
#   --force --json`), never leaves it hidden.
# - Homebrew: `update`, and `install` / `upgrade` of a formula that exists,
#   change the host's Homebrew; only answers about one no tap has, and
#   reads of factorium's own install, run.
# - mytokens: `list`, and `get` of a secret that exists: mytokens has no
#   scratch vault, so either reads the host's own tokens. `get` of a
#   secret nobody has runs (on a mytokens server it also tells the owner
#   through Bark).
# - launchd: only a scratch agent, `/usr/bin/true`, never run at load.

[contract]
# The command that runs the scenarios' fakes: each fake is a program of
# FakeHost::run there, and each has a [[standin]] below.
standins = ["crates/factorium/tests/contract/standin"]
fresh_days = 30

[[standin]]
name = "orca"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "Orca's app running, `orca` on PATH"
ready = ["orca", "status", "--json"]
version = ["orca", "--version"]
normalise = [
  # Orca's handles and ids, and where it keeps a worktree.
  { pattern = '"(handle|id)":"[^"]*"', replace = '"$1":"<id>"' },
  { pattern = 'term[-_][0-9a-f-]+', replace = "<terminal>" },
  { pattern = '"ok":"[^"]*/truefit-[a-z-]+"', replace = '"ok":"<worktree>"' },
  # Orca's id of a refused prompt, for a retry factorium never makes.
  { pattern = ' Terminal prompt request ID: [^"]*', replace = "" },
  # Where the nested worktree Orca refuses for is.
  { pattern = 'registered worktree: [^"]*/truefit-[a-z-]+/', replace = "registered worktree: <worktree>/" },
  # Where a case's worktree is, in the git steps run in it.
  { pattern = '"/[^"]*/truefit-nested-worktree', replace = '"<worktree>' },
]
# What factorium handles after a step took effect (fakes::ORCA_FAULTS): a
# message given to a session's outbox that Orca will not type (it stays
# not typed, and whoever said it hears so); a worktree Orca will not remove
# after an abandon forced its branch (the close is refused, the worktree
# and the branch stay). A terminal Orca will not open in a worktree it
# holds, or will not close, it cannot be made to refuse on a host: no
# fault stands for either.
faults = ["send-refused", "remove-refused"]

# What factorium makes of Orca's answers about what it does not hold.
[[standin.case]]
name = "unknown"
stdin = """
{"orca": "screen", "args": ["truefit-no-such-terminal"]}
{"orca": "close", "args": ["truefit-no-such-terminal"]}
{"orca": "ready", "args": ["truefit-no-such-terminal"]}
{"orca": "press", "args": ["truefit-no-such-terminal", "\\u001b"]}
{"orca": "remove", "args": ["{dir}/no-such-worktree"]}
{"run": ["orca", "repo", "show", "--repo", "path:{dir}", "--json"], "read": ["/ok", "/error/code"]}
{"run": ["orca", "terminal", "create", "--worktree", "path:{dir}", "--title", "t", "--command", "true", "--json"], "read": ["/ok", "/error/code"]}
"""

# A worker's life in Orca: its worktree made, its terminal opened, read,
# typed at, listed, closed, and the worktree removed.
[[standin.case]]
name = "worktree-and-terminal"
stdin = """
{"scratch": "truefit-worktree-and-terminal"}
{"orca": "worktree", "args": ["{scratch}", "truefit-worktree-and-terminal", "truefit-worktree-and-terminal", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "cat"], "keep": {"terminal": "/ok"}}
{"orca": "ready", "args": ["{terminal}"]}
{"orca": "screen", "args": ["{terminal}"]}
{"orca": "listed", "args": ["{terminal}"]}
{"orca": "send", "args": ["{terminal}", "typed"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "screen", "args": ["{terminal}"]}
{"orca": "listed", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-worktree-and-terminal"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A terminal Orca will not type at: the real one closed first.
[[standin.case]]
name = "send-refused"
fault = "send-refused"
stdin = """
{"scratch": "truefit-send-refused"}
{"orca": "worktree", "args": ["{scratch}", "truefit-send-refused", "truefit-send-refused", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "cat"], "keep": {"terminal": "/ok"}}
{"orca": "ready", "args": ["{terminal}"]}
{"orca": "close", "args": ["{terminal}"], "only": "real"}
{"orca": "send", "args": ["{terminal}", "typed"]}
{"orca": "deliver", "args": ["{terminal}", "typed"]}
{"orca": "press", "args": ["{terminal}", "\\u001b"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-send-refused"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A worktree that holds another git worktree (slimfit's comparison one):
# Orca refuses to remove it, naming the nested one, until that goes.
[[standin.case]]
name = "nested-worktree"
stdin = """
{"scratch": "truefit-nested-worktree"}
{"orca": "worktree", "args": ["{scratch}", "truefit-nested-worktree", "truefit-nested-worktree", "{sha}"], "keep": {"worktree": "/ok"}}
{"run": ["git", "-C", "{worktree}", "worktree", "add", "--quiet", "--detach", "{worktree}/.slimfit/out/before", "HEAD"], "read": "ok"}
{"orca": "remove", "args": ["{worktree}"]}
{"run": ["git", "-C", "{worktree}", "worktree", "remove", "--force", "{worktree}/.slimfit/out/before"], "read": "ok"}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-nested-worktree"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# A worktree Orca will not remove: the real one a directory it does not hold.
[[standin.case]]
name = "remove-refused"
fault = "remove-refused"
stdin = """
{"run": ["mkdir", "{dir}/held"], "read": "ok"}
{"orca": "remove", "args": ["{dir}/held"]}
"""

# live_orca's checks: a tell to a Claude Code busy in a call that never
# returns only queues; one sent with its interrupt key is read now, as
# the session shows, though Orca sees no turn start. Its own
# stand-in, as its real run needs Claude Code logged in, and spends a turn.
[[standin]]
name = "orca-claude"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "Orca's app running, `orca` on PATH, and Claude Code logged in (`claude` on PATH)"
ready = ["sh", "-c", "orca status --json >/dev/null && claude --version"]
version = ["sh", "-c", "echo \"orca $(orca --version), claude $(claude --version)\""]
normalise = [
  { pattern = '"(handle|id)":"[^"]*"', replace = '"$1":"<id>"' },
  { pattern = 'term[-_][0-9a-f-]+', replace = "<terminal>" },
  { pattern = '"ok":"[^"]*/truefit-[a-z-]+"', replace = '"ok":"<worktree>"' },
]

[[standin.case]]
name = "busy-tell"
stdin = """
{"scratch": "truefit-busy-tell"}
{"orca": "worktree", "args": ["{scratch}", "truefit-busy-tell", "truefit-busy-tell", "{sha}"], "keep": {"worktree": "/ok"}}
{"run": ["mkfifo", "{worktree}/never"], "only": "real"}
{"orca": "open", "args": ["{worktree}", "truefit", "claude --dangerously-skip-permissions --model haiku"], "keep": {"terminal": "/ok"}}
# A scratch folder: the real one asks whether to trust it, and is answered as a person does.
{"run": ["sleep", "5"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--text", "\\u001b[B", "--json"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--enter", "--json"], "only": "real"}
{"orca": "ready", "args": ["{terminal}"]}
# Busy: in the real one, a call that never returns (Claude Code 2.1.330
# moves one to the background after 20s, so the tells go well before);
# in the fake, as a scenario sets it. Orca sees no turn that starts right
# after an interrupt (live_orca took the session's own file for it).
{"orca": "deliver", "args": ["{terminal}", "Call the Bash tool once, in the foreground (run_in_background false, no timeout change), with the command: cat never. Do not run it in the background."], "only": "real"}
{"run": ["sleep", "3"], "only": "real"}
{"world": {"busy": "{terminal}", "unobserved": true}}
{"orca": "deliver", "args": ["{terminal}", "Plain tell: reply QUEUED-SEEN."]}
{"orca": "deliver", "args": ["{terminal}", "Told now: reply NOW-SEEN and nothing else.", "\\u001b"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-busy-tell"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

# factorium#179: idle, with a shell it moved to the background, Claude
# Code 2.1.330 is working as Orca 1.4.267 sees it, so a wait for tui-idle
# times out, before an Escape as after it. A tell sent with its interrupt
# key is still typed, and starts a turn.
[[standin.case]]
name = "idle-background-tell"
stdin = """
{"scratch": "truefit-idle-background-tell"}
{"orca": "worktree", "args": ["{scratch}", "truefit-idle-background-tell", "truefit-idle-background-tell", "{sha}"], "keep": {"worktree": "/ok"}}
{"orca": "open", "args": ["{worktree}", "truefit", "claude --dangerously-skip-permissions --model haiku"], "keep": {"terminal": "/ok"}}
{"run": ["sleep", "5"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--text", "\\u001b[B", "--json"], "only": "real"}
{"run": ["orca", "terminal", "send", "--terminal", "{terminal}", "--enter", "--json"], "only": "real"}
{"orca": "ready", "args": ["{terminal}"]}
# The real one starts a shell in the background and ends its turn; the
# fake holds one as a scenario sets it.
{"orca": "deliver", "args": ["{terminal}", "Call the Bash tool once with run_in_background set to true and the command: sleep 900. Then reply STARTED and end your turn."], "only": "real"}
{"run": ["sleep", "15"], "only": "real"}
{"world": {"background": "{terminal}"}}
{"run": ["orca", "terminal", "wait", "--terminal", "{terminal}", "--for", "tui-idle", "--timeout-ms", "3000", "--json"], "read": ["/ok", "/error/code"]}
{"orca": "press", "args": ["{terminal}", "\\u001b"]}
{"orca": "deliver", "args": ["{terminal}", "Told now: reply NOW-SEEN and nothing else.", "\\u001b"]}
{"orca": "close", "args": ["{terminal}"]}
{"orca": "remove", "args": ["{worktree}"]}
{"scratch": "truefit-idle-background-tell"}
{"run": ["orca", "repo", "hide", "--repo", "path:{scratch}", "--json"], "only": "real"}
"""

[[standin]]
name = "brew"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "Homebrew, with factorium installed from it"
ready = ["brew", "list", "--versions", "factorium"]
version = ["brew", "--version"]
normalise = [
  { pattern = '"out":"[^"]*/opt/', replace = '"out":"<prefix>/opt/' },
  { pattern = 'factorium [0-9][^\\"]*', replace = "factorium <version>" },
]

[[standin.case]]
name = "no-such-formula"
env = { HOMEBREW_NO_AUTO_UPDATE = "1", HOMEBREW_NO_ENV_HINTS = "1" }
stdin = """
{"run": ["brew", "list", "--formula", "factorium-truefit-none"]}
{"run": ["brew", "list", "--versions", "factorium-truefit-none"], "read": "out"}
{"run": ["brew", "upgrade", "factorium-truefit-none"]}
{"run": ["brew", "install", "factorium-truefit-none"]}
"""

# factorium as Homebrew installed it: what `Brew::upgrade` and `Brew::bin` read.
[[standin.case]]
name = "installed"
env = { HOMEBREW_NO_AUTO_UPDATE = "1", HOMEBREW_NO_ENV_HINTS = "1" }
stdin = """
{"world": {"installed": {"factorium": "0.1.0"}}}
{"run": ["brew", "list", "--formula", "factorium"]}
{"run": ["brew", "list", "--versions", "factorium"], "read": "out"}
{"run": ["brew", "--prefix", "factorium"], "read": "out"}
"""

[[standin]]
name = "mytokens"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "mytokens on PATH"
# The app's version: mytokens is a link into it, and has no --version.
version = ["sh", "-c", 'b=$(readlink "$(command -v mytokens)"); echo "MyTokens $(defaults read "${b%/MacOS/*}/Info" CFBundleShortVersionString)"']

[[standin.case]]
name = "no-such-secret"
stdin = """
{"run": ["mytokens", "get", "factorium-truefit-none", "--json"], "read": "out"}
"""

[[standin]]
name = "slimfit"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "slimfit on PATH, and cargo-mutants (its mutants list)"
version = ["slimfit", "--version"]

# `worker pick-mutants` and `review-growth`: the picker's and the
# reviewer's goals, and a change's candidates, of which factorium reads
# the names.
[[standin.case]]
name = "pick"
dir = "crates/factorium/tests/contract/slimfit-change"
stdin = """
{"world": {"slimfit": {"help picker": "The goal.", "help reviewer": "The reviewer's goal.", "check": "{\\"candidates\\": {\\"rust\\": [{\\"name\\": \\"src/lib.rs:4:27: replace a -> bool with true\\"}, {\\"name\\": \\"src/lib.rs:4:27: replace a -> bool with false\\"}, {\\"name\\": \\"src/lib.rs:4:29: replace == with != in a\\"}]}}"}}}
{"run": ["git", "init", "-q", "-b", "main"], "read": "ok"}
{"run": ["git", "add", "-A"], "read": "ok"}
{"run": ["git", "-c", "user.name=t", "-c", "user.email=t@t", "commit", "-q", "-m", "base"], "read": "ok"}
{"run": ["git", "checkout", "-q", "-b", "change"], "read": "ok"}
{"run": ["sh", "-c", "echo 'pub fn a(x: u8) -> bool { x == 1 }' >> src/lib.rs"], "read": "ok"}
{"run": ["git", "-c", "user.name=t", "-c", "user.email=t@t", "commit", "-q", "-am", "change"], "read": "ok"}
{"run": ["slimfit", "help", "picker"]}
{"run": ["slimfit", "help", "reviewer"]}
{"run": ["slimfit", "check", "--repo", "{dir}", "--mutants"], "read": ["/candidates/*/*/name"]}
"""

[[standin]]
name = "launchctl"
run = ["crates/factorium/tests/contract/standin", "fake"]
real = ["crates/factorium/tests/contract/standin", "real"]
needs = "macOS's launchctl, in a GUI login session"
normalise = [
  { pattern = 'gui/[0-9]+', replace = "gui/<uid>" },
  { pattern = '[0-9]+-[0-9]{13}', replace = "<nonce>" },
]
version = ["sw_vers", "-productVersion"]

# `service install`, `stop` and `remove`, on a scratch agent's label.
[[standin.case]]
name = "agent"
dir = "crates/factorium/tests/contract/launchd-agent"
stdin = """
{"run": ["sed", "-i", "", "s/{label}/com.github.sunfmin.factorium.truefit-{nonce}/", "agent.plist"], "read": "ok"}
{"run": ["launchctl", "print", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "bootstrap", "gui/{uid}", "{dir}/agent.plist"]}
{"run": ["launchctl", "bootstrap", "gui/{uid}", "{dir}/agent.plist"]}
{"run": ["launchctl", "print", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "bootout", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "print", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
{"run": ["launchctl", "bootout", "gui/{uid}/com.github.sunfmin.factorium.truefit-{nonce}"]}
"""

# The heavy queue's design (SPEC §1 row 9), model-checked by TLC
# (truefit ADR 0001): models/HeavyQueue.tla, one model checked under three
# configs, each the smallest that still shows its properties fail on a
# broken variant (`models/heavy.sh broken`), and each bounded in depth.
# A scenario's run is checked as its trace (`models/heavy.sh trace`).
[[model]]
name = "heavy-starts"
spec = "models/HeavyQueue.tla"
config = "models/HeavyStarts.cfg"
limit = 120
commit = "d1387704c1fe93e4076d405fc4f2912803e9f44b"
covers = [
  { action = "Arrives", file = "crates/factorium/src/heavy.rs", function = "App::take_turn (EnqueueHeavy)" },
  { action = "Arrives", file = "crates/domain/src/heavy.rs", function = "EnqueueHeavy" },
  { action = "Ask", file = "crates/factorium/src/heavy.rs", function = "App::heavy, App::take_turn (StartHeavy), App::as_installed" },
  { action = "Ask", file = "crates/domain/src/heavy.rs", function = "StartHeavy, older, Queue::may_start" },
  { action = "Ask", file = "crates/domain/src/neutral/queue.rs", function = "may_start, next, oldest, overdue" },
  { action = "AtOnce", file = "crates/domain/src/neutral/queue.rs", function = "may_start" },
  { action = "InOrder", file = "crates/domain/src/neutral/queue.rs", function = "next" },
  { action = "LineAhead", file = "crates/domain/src/neutral/queue.rs", function = "next" },
  { action = "Settled", file = "crates/domain/src/neutral/queue.rs", function = "may_start" },
]

[[model]]
name = "heavy-ends"
spec = "models/HeavyQueue.tla"
config = "models/HeavyEnds.cfg"
limit = 120
commit = "890afa5c95a79d6c0a59c338ad324a4d3db20a12"
covers = [
  { action = "NoteRun", file = "crates/domain/src/heavy.rs", function = "NoteRun" },
  { action = "NoteRun", file = "crates/factorium/src/heavy.rs", function = "App::run_held, App::look_at (NoteRun)" },
  { action = "Look", file = "crates/factorium/src/heavy.rs", function = "App::look_at" },
  { action = "Look", file = "crates/domain/src/heavy.rs", function = "Queue::ends, Queue::overheld" },
  { action = "Look", file = "crates/domain/src/neutral/queue.rs", function = "overheld" },
  { action = "Done", file = "crates/factorium/src/heavy.rs", function = "App::run_held, App::heavy (EndHeavy), App::beside" },
  { action = "Unqueue", file = "crates/factorium/src/owner.rs", function = "App::unqueue" },
  { action = "Unqueue", file = "crates/domain/src/heavy.rs", function = "EndHeavy" },
  { action = "NotCutShort", file = "crates/domain/src/heavy.rs", function = "Queue::ends" },
  { action = "HeldEnded", file = "crates/factorium/src/heavy.rs", function = "App::look_at" },
  { action = "UnqueuedRunAnswers", file = "crates/factorium/src/heavy.rs", function = "App::run_held" },
  { action = "Unqueued", file = "crates/factorium/src/heavy.rs", function = "App::heavy (queued), App::take_turn (unqueued)" },
  { action = "UnqueuedAnswers", file = "crates/factorium/src/heavy.rs", function = "App::take_turn" },
]

# A run of the queue and its waiters, in the model's own units and shape
# (None is -1): the waiters' own steps (look, answer) are no event of the
# queue, so its traces carry them beside the queue's records
# (.truefit/traces/heavy-ends/).
[model.trace]
q = '[i \in Ids |-> r.state.q[i]]'
last_start = 'r.state.last_start'
rules = 'r.state.rules'
now = 'r.now'
waiter = '[i \in Ids |-> r.state.waiter[i]]'
last = 'r.last'

[[model]]
name = "heavy-rules"
spec = "models/HeavyQueue.tla"
config = "models/HeavyRules.cfg"
limit = 60
commit = "890afa5c95a79d6c0a59c338ad324a4d3db20a12"
covers = [
  { action = "NoteRules", file = "crates/domain/src/heavy.rs", function = "NoteRules" },
  { action = "NoteRules", file = "crates/factorium/src/heavy.rs", function = "App::note_rules" },
  { action = "NoteRules", file = "crates/factorium/src/daemon.rs", function = "App::daemon_start" },
  { action = "StaleHoldsNone", file = "crates/domain/src/heavy.rs", function = "Queue::stale, Queue::live, Queue::may_start" },
  { action = "StaleRefused", file = "crates/factorium/src/heavy.rs", function = "App::heavy (stale), App::as_installed" },
  { action = "StaleRefused", file = "crates/domain/src/heavy.rs", function = "StartHeavy" },
  { action = "GivesUp", file = "crates/factorium/src/heavy.rs", function = "App::take_turn (End keeps)" },
  { action = "GivesUp", file = "crates/domain/src/heavy.rs", function = "EndHeavy, Heavy::evolve (HeavyEnded)" },
  { action = "Rejoin", file = "crates/factorium/src/heavy.rs", function = "App::take_turn (EnqueueHeavy keep)" },
  { action = "Rejoin", file = "crates/domain/src/heavy.rs", function = "EnqueueHeavy, Queue::place, Heavy::evolve (HeavyQueued)" },
  { action = "KeptPlace", file = "crates/domain/src/heavy.rs", function = "Queue::place" },
]

# A scenario's run, as the queue records it (crates/factorium/tests/
# scenarios/fixture/trace.rs): its constants are the scenario's, and its
# own check is one step deep; the properties are the three above's.
[[model]]
name = "heavy-run"
spec = "models/HeavyQueue.tla"
config = "models/HeavyRun.cfg"
limit = 60
commit = "890afa5c95a79d6c0a59c338ad324a4d3db20a12"
covers = [
  { action = "Next", file = "crates/domain/src/heavy.rs", function = "Heavy::evolve" },
]

# Each record's queue, in the model's units (500 ms); the waiters and the
# last step are left free.
[model.trace]
q = '[i \in Ids |-> IF i > Len(r.state.q) THEN Absent ELSE LET e == r.state.q[i] IN [in |-> e.in, queued_at |-> e.queued_at \div 500, started_at |-> e.started_at \div 500, yields |-> e.yields, bound_at |-> e.bound_at \div 500, noted |-> e.noted]]'
last_start = 'r.state.last_start \div 500'
rules = 'r.state.rules'
now = 'r.now \div 500'

# A checkout's line (SPEC §1.12-1.14, §2), model-checked by TLC:
# models/Line.tla under its configs, each the smallest that still shows its
# properties fail on a broken variant (`models/line.sh broken`); what the
# code breaks is `models/line.sh finding`. A scenario's run is checked as
# its trace (`models/line.sh trace`).
[[model]]
name = "line"
