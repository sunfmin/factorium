# The promises the README and the ADRs make, each tied to the check
# that keeps it (`truefit promise`; the candidates' marks are in
# .truefit/promises.json).
[promises]
sources = ["README.md", "docs/adr/*.md"]

[[promise]]
name = "waiting-moves-only-by-ready"
says = "only a person's `issue ready` moves it again"
source = "docs/adr/0008-roles-and-waiting-issues.md:33"
check = ["test"]

[[promise]]
name = "role-dir-never-written"
says = "the role's directory read and never written"
source = "docs/adr/0008-roles-and-waiting-issues.md:21"
check = ["test"]

[[promise]]
name = "used-up-account-waits"
says = "its issue waits, behind ready issues that can start, and holds admission (`kit: …`, the pick's reasons) only when none can"
source = "docs/adr/0009-accounts-are-stablehands.md:26"
check = ["test"]

[[promise]]
name = "admission-from-readings"
says = "whether one more worker may start now, from the host's readings alone"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:15"
check = ["test"]
why = "admission is a function of one tick's readings and nothing else; admission.rs drives each reading, the queue's wait among them"

[[promise]]
name = "at-once"
says = "never starves the oldest (it starts at once when nothing runs)"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:21"
check = ["model heavy-starts"]
why = "factorium has no `truefit sim`: the model checks every order the waiters can ask in, which is what a sim would sample"

[[promise]]
name = "settled"
says = "starts one beside what runs only on a reading taken `heavy_settle` after the last start, or `heavy_settle_idle` after it on a reading at most half of `cpu_busy_max`"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:21"
check = ["model heavy-starts"]

[[promise]]
name = "urgent-ahead"
says = "its worker's heavy commands go ahead of those not urgent, behind a line move past its bound, as its issue is marked at each ask"
source = "docs/adr/0015-an-urgent-issue-halts-the-host.md:20"
check = ["model heavy-urgent"]

[[promise]]
name = "landing-ahead"
says = "then a landing's fast gate, oldest first"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:27"
check = ["model heavy-urgent"]

[[promise]]
name = "halt"
says = "once its worker starts, until the issue closes or is unmarked, a worker's or program's heavy command not urgent that runs is cut short once an urgent one waits with no room for what it holds"
source = "docs/adr/0015-an-urgent-issue-halts-the-host.md:24"
check = ["model heavy-urgent"]

[[promise]]
name = "held-ended"
says = "ends one that holds others up past the hold bound"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:21"
check = ["model heavy-ends"]

[[promise]]
name = "ended-whole"
says = "A run is ended whole, by one path whoever ends it"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:22"
check = ["test"]

[[promise]]
name = "unqueued-run-answers"
says = "an unqueued run's waiter answers `unqueued`"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:23"
check = ["model heavy-ends"]

[[promise]]
name = "gate-priority"
says = "so the CPU goes to a gate before it"
source = "docs/adr/0010-admission-and-the-heavy-queue.md:26"
check = ["test"]

[[promise]]
name = "line-ahead"
says = "A line move (promotion, cut) past its bound goes ahead of workers' and programs' waiting entries, taking the next free slot"
