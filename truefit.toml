# The promises SPEC, README and the ADRs make, each tied to the check
# that keeps it (`truefit promise`; the candidates' marks are in
# .truefit/promises.json).
[promises]
sources = ["SPEC.md", "README.md", "docs/adr/*.md"]

[[promise]]
name = "waiting-moves-only-by-ready"
says = "only a person's `issue ready` moves it again"
source = "SPEC.md:33"
check = ["test"]

[[promise]]
name = "role-dir-never-written"
says = "the role's directory read and never written"
source = "SPEC.md:33"
check = ["test"]

[[promise]]
name = "used-up-account-waits"
says = "While a named account is used up its issue waits, behind ready issues that can start, and holds admission (`kit: …`) only when none can."
source = "SPEC.md:37"
check = ["test"]

[[promise]]
name = "admission-from-readings"
says = "Whether one more worker may start now, from the host's readings alone"
source = "SPEC.md:38"
check = ["test"]
why = "admission is a function of one tick's readings and nothing else; admission.rs drives each reading, the queue's wait among them"

[[promise]]
name = "at-once"
says = "never starves the oldest (it starts at once when nothing runs)"
source = "SPEC.md:39"
check = ["model heavy-starts"]
why = "factorium has no `truefit sim`: the model checks every order the waiters can ask in, which is what a sim would sample"

[[promise]]
name = "settled"
says = "starts one beside what runs only on a reading taken `heavy_settle` after the last start"
source = "SPEC.md:39"
check = ["model heavy-starts"]

[[promise]]
name = "held-ended"
says = "ends one that holds others up past the hold bound"
source = "SPEC.md:39"
check = ["model heavy-ends"]

[[promise]]
name = "ended-whole"
says = "A run is ended whole, by one path whoever ends it"
source = "SPEC.md:39"
check = ["test"]

[[promise]]
name = "unqueued-run-answers"
says = "an unqueued run's waiter answers `unqueued`"
source = "SPEC.md:39"
check = ["model heavy-ends"]

[[promise]]
name = "gate-priority"
says = "so the CPU goes to a gate before it"
source = "SPEC.md:39"
check = ["test"]

[[promise]]
name = "line-ahead"
says = "A line move (promotion, cut) past its bound goes ahead of workers' and programs' waiting entries, taking the next free slot"
source = "SPEC.md:39"
check = ["model heavy-starts"]

[[promise]]
name = "not-cut-short"
says = "a running entry is never cut short for it"
source = "SPEC.md:39"
check = ["model heavy-ends"]

[[promise]]
name = "kept-place"
says = "the same worker (or program) asking the same command again within it takes that place, not the back"
source = "SPEC.md:39"
check = ["model heavy-rules"]

[[promise]]
name = "gated-once-per-tree"
says = "A green run is recorded against the tree it ran on, so the same tree is never gated twice."
source = "SPEC.md:41"
check = ["test"]
why = "it is decided by one daemon tick or one command from what the database holds, and ticks run one at a time (one daemon, the pid lock, §1); its scenarios drive each order the system can be in"

[[promise]]
name = "promotion-within-bound"
says = "does not push the promotion past its bound"
source = "SPEC.md:43"
check = ["test"]

[[promise]]
name = "base-follows-never-further"
says = "on every tick to origin's base as last fetched, never further"
source = "SPEC.md:43"
check = ["test"]

[[promise]]
name = "base-never-reset-over-work"
says = "One with commits of its own, or checked out over changes not committed, is never reset"
source = "SPEC.md:43"
check = ["test"]

[[promise]]
name = "one-round-per-episode"
says = "an episode starts at most one **round**"
source = "SPEC.md:45"
check = ["test"]

[[promise]]
name = "rules-change-between-rounds"
says = "closes that session between rounds, never in one"
source = "SPEC.md:45"
check = ["test"]

[[promise]]
name = "idle-only-when-idle"
says = "at most once per `every` (from the last run's start) and within `limit` for all the steps"
source = "SPEC.md:46"
check = ["test"]
why = "it is decided by one daemon tick or one command from what the database holds, and ticks run one at a time (one daemon, the pid lock, §1); its scenarios drive each order the system can be in; idle.rs runs it against a worker, a heavy command and its limit"

[[promise]]
name = "idle-gives-way"
says = "so it never goes ahead of a promotion, a cut, a worker's start or a waiting heavy command"
source = "SPEC.md:46"
check = ["test"]
why = "it is decided by one daemon tick or one command from what the database holds, and ticks run one at a time (one daemon, the pid lock, §1); its scenarios drive each order the system can be in; idle.rs queues a command beside running idle work"

[[promise]]
name = "one-open-per-kind"
says = "So each kind has at most one open issue"
source = "SPEC.md:46"
check = ["test"]

[[promise]]
name = "tasks-within-bound"
says = "its tasks line runs without an idle host"
source = "SPEC.md:46"
check = ["test"]

[[promise]]
name = "cut-blocker-met-on-install"
says = "`<checkout>#N@cut` is met only once a cut of that checkout holds its landing"
source = "SPEC.md:56"
check = ["test"]

[[promise]]
name = "typed-only-when-up"
says = "Text is typed at a session only once its harness's own screen is up there"
source = "SPEC.md:68"
check = ["test"]

[[promise]]
name = "worker-comment-changes-nothing"
says = "a comment on its issue by it that changes nothing else and goes to no one"
source = "SPEC.md:73"
check = ["test"]

[[promise]]
name = "work-never-lost"
says = "its worktree is removed unless it holds work that is nowhere else"
source = "SPEC.md:93"
check = ["model worktrees"]

[[promise]]
name = "no-start-over-under-worker"
says = "only while no worker is on the issue"
source = "SPEC.md:102"
check = ["model worktrees"]

[[promise]]
name = "off-path-to-watch"
says = "Off the path, everything goes to the watch"
source = "SPEC.md:136"
check = ["test"]

[[promise]]
name = "landing-moves"
says = "a landing no gate runs for past `stall_bound`"
source = "SPEC.md:140"
check = ["model line-live"]

[[promise]]
name = "promotion-moves"
says = "the oldest unpromoted landing past `promotion_bound` with no promotion running"
source = "SPEC.md:140"
check = ["model line-live"]

[[promise]]
name = "stalled-queue-found"
says = "a heavy queue that starts nothing past `stall_bound`"
source = "SPEC.md:140"
check = ["test"]
why = "the finding is read from the queue's records by one doctor pass; stall.rs holds the queue still and past the hold bound"

[[promise]]
name = "guard-worker-only"
says = "the guard lets a worker run only"
source = "SPEC.md:174"
check = ["test"]

[[promise]]
name = "promote-refused-while-running"
says = "while a promotion of that checkout runs, the daemon's or another `promote`, it is refused"
source = "SPEC.md:180"
check = ["test"]
