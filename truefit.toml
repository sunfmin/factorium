[[promise]]
name = "nothing-ahead-of-brief"
says = "Nothing is typed before the harness is up, nor ahead of the brief."
source = "SPEC.md:184"
check = ["test"]
why = "each session's outbox is one record, typed in order by one daemon; outbox.rs holds the brief and what comes after it"

[[promise]]
name = "comment-never-stops-turn"
