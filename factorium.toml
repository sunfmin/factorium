# How factorium gates and cuts itself (SPEC.md §5).

[gate]
fast = "./gate.sh"
fast_limit = 900
slow = "./slow.sh"
slow_limit = 1800
# What every landing's gate rewrites: a landing whose only conflicts are
# these takes proving's copy and lands them as its gate left them (SPEC.md
# §1.12). slimfit's baseline only `slimfit ratchet` writes, so it lands as
# proving's.
regenerated = [".slimfit/baseline.json", ".truefit/models/*.json"]

[cut]
steps = ["packaging/release.sh cut $FACTORIUM_VERSION"]
formula = "sunfmin/tap/factorium"
limit = 1800

# No steps: nothing here is too slow for the gates (slow.sh is gate.sh
# again). The tasks line files slimfit's tasks and a sample of 5 mutants
# of what landed (`slimfit help sample`). Measured 2026-11-20 at load
# 5-32: `slimfit next --all` 350s, `--sample 5` 1631s; the limit is ~3.6x.
[idle]
tasks = "slimfit --version && slimfit next --all --sample 5 && ./lines.sh --tasks && truefit --version && truefit next --all"
every = 86400
limit = 7200
