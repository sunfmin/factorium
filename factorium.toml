# How factorium gates and cuts itself (the fields: crates/domain/src/declared.rs).

[gate]
fast = "./gate.sh"
fast_limit = 900
slow = "./slow.sh"  # only what gate.sh lacks
slow_limit = 1800
# What every landing's gate rewrites: a landing whose only conflicts are
# these takes proving's copy and lands them as its gate left them
# (docs/adr/0012). slimfit's baseline only `slimfit ratchet` writes, so it lands as
# proving's.
regenerated = [".slimfit/baseline.json", ".truefit/models/*.json", ".docfit/baseline.json"]

[cut]
# The host's build, then the tap's release.yml run that signs, notarizes and
# publishes (docs/adr/0004). release.sh waits at most RELEASE_WAIT_LIMIT
# (1700s) from its start: inside this limit, and inside the heavy queue's
# hold bound (1800s), past which a cut holding others up is ended.
steps = ["packaging/release.sh cut $FACTORIUM_VERSION"]
formula = "sunfmin/tap/factorium"
limit = 1800

# No steps: nothing here is too slow for the gates (slow.sh is the release
# build and the models; a promotion that runs gate.sh before them runs
# both within slow_limit, ~810s of 1800s). The tasks line files slimfit's tasks and a sample of 5
# mutants of what landed (`slimfit help sample`). Measured 2026-11-20 at load
# 5-32: `slimfit next --all` 350s, `--sample 5` 1631s; the limit is ~3.6x.
[idle]
tasks = "slimfit --version && slimfit next --all --sample 5 && ./lines.sh --tasks && truefit --version && truefit next --all && docfit --version && docfit next --all"
every = 86400
limit = 7200
