[package]
name = "factorium-host"
description = "The host's effects for factorium: git, Orca terminals, commands with limits, readings, processes, stablehand, Homebrew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Tested only from the outermost layer (SPEC §6): no unit or doc tests of its own.
[lib]
test = false
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# The database copy a binary is proven on (`VACUUM INTO`): factum's own rusqlite.
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
