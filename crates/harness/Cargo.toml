[package]
name = "factorium-harness"
description = "What factorium knows of each harness: how a session of it starts and is handed its brief, how its hook is asked about a tool call, where it keeps its session and which lines start or end a turn, which screen words mean a quota or a refusal, and the machine an engine account's bound login names"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Tested only from the outermost layer (docs/adr/0032): no unit or doc tests of its own.
[lib]
test = false
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
ruzstd = "0.9"
# This machine's name (`account::this_machine`), without running `hostname`.
gethostname = "1"

[lints]
workspace = true
