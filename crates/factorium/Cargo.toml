[package]
name = "factorium"
description = "Runs AI coding agents on one machine while nobody watches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# Tested only from the outermost layer (docs/adr/0032): no unit or doc tests of its own.
[lib]
test = false
doctest = false

[[bin]]
name = "factorium"
path = "src/main.rs"
test = false

[dependencies]
factorium-domain.workspace = true
factum.workspace = true
factum-sqlite.workspace = true
factorium-host.workspace = true
factorium-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap.workspace = true
agent-help.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
toml = "0.8"
# The scenarios raise their own open-files limit (`open_files_enough`).
libc = "0.2"
rusqlite = { version = "0.42", features = ["bundled"] }

[lints]
workspace = true
