"docs/adr/0004-cuts-are-signed-and-notarized-by-the-taps-workflow.md" = "adr"
"docs/adr/0005-the-tick-and-the-process-that-ticks.md" = "adr"
"docs/adr/0006-the-concepts-are-fixed.md" = "adr"
"docs/adr/0007-roles-and-waiting-issues.md" = "adr"
"docs/adr/0008-accounts-are-stablehands.md" = "adr"
"docs/adr/0009-admission-and-the-heavy-queue.md" = "adr"
