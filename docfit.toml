# How docfit keeps factorium's documents (`docfit --help`). local_issue_refs: the checkouts
# factorium runs on this host, whose `<name>#<n>` cites its local tracker.
local_issue_refs = ["chessmirror", "docfit", "factorium", "factum", "horizon-labs", "lore", "rolesmith", "rollmind", "sesame", "slimfit", "stablehand", "truefit"]

ignore = ["crates/factorium/src/**"]

[documents]
"README.md" = "readme"
"docs/adr/0001-owner-commands-by-concept.md" = "adr"
"docs/adr/0002-binary-is-the-process-edge.md" = "adr"
"docs/adr/0003-the-line-is-one-pass-and-its-moves.md" = "adr"
"docs/adr/0004-cuts-are-signed-and-notarized-by-the-taps-workflow.md" = "adr"
"docs/adr/0005-the-tick-and-the-process-that-ticks.md" = "adr"
"docs/adr/0006-mutants-are-owed-at-promotion.md" = "adr"
